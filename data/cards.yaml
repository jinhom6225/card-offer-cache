# 카드 보너스 알림 — 카드 데이터 (진호님이 GitHub 웹에서 직접 고치는 파일)
# 편집 방법·항목 설명은 README.md를 보세요. 저장(커밋)하면 검증기가 자동으로 확인합니다.
#
# !!! 아래 2장은 형식 확인용 SAMPLE(가짜) 데이터입니다 !!!
# 카드 이름·보너스·연회비 등 모든 숫자는 지어낸 값이며 실제 오퍼가 아닙니다.
# Phase 4에서 실제 30종 데이터로 교체합니다.

cards:
  # --- SAMPLE 1: 개인 카드, "평소보다 높음" 상태(elevated 있음), 보너스가 여러 부분 ---
  - id: sample-travel-card
    name: Sample Travel Rewards Card (SAMPLE)
    issuer: Chase
    segment: personal
    official_url: https://creditcards.chase.com/
    last_verified: 2026-11-08
    sources:
      - https://creditcards.chase.com/
    annual_fee:
      amount: 95
      first_year_waived: false
    foreign_tx_fee_pct: 0
    bonus:
      current:
        parts:
          - value: 80000
            unit: points
          - value: 1
            unit: free_night
        min_spend: 4000
        spend_months: 3
        note_en: "SAMPLE: fictional bonus for format testing only."
        note_ko: "샘플: 형식 확인용 가짜 보너스입니다."
