        parts:
          - value: 60000
            unit: points
        note_en: ""
        note_ko: ""
    elevated:
      start: 2026-11-01
      end: 2026-12-31
    earn:
      - category_en: Travel
        category_ko: 여행
        rate: 3
        unit: points
